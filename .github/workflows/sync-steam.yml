name: Sync Steam library

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-steam-library
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.STEAM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import played games
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python scripts/import_steam.py

      - name: Commit updated library
        run: |
          if git diff --quiet -- data/steam.json; then
            echo "Steam library is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam.json
          git commit -m "data: sync Steam library"
          git push
